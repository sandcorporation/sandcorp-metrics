# `make prod-local` 전용: docker-compose.prod.yml 위에 로컬 MySQL을 얹어 OCI MySQL HeatWave를 대신한다.
# Jenkins는 쓰지 않는다(그쪽 COMPOSE_FILE은 prod + oracle). 계정은 .env의 DB_NAME/DB_USER/DB_PASSWORD.
# web은 127.0.0.1:18094에 뜬다(prod 기본 바인딩).
services:
  web:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy

  scheduler:
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:26.10.0
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_0900_as_cs]
    environment:
      MYSQL_DATABASE: ${DB_NAME:-metrics}
      MYSQL_USER: ${DB_USER:-metrics}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' \"$$MYSQL_DATABASE\""]
      interval: 2s
      timeout: 3s
      retries: 60

volumes:
  mysqldata:
