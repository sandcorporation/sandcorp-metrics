# production 되돌리기(#32): 운영을 옛 main 커밋으로 돌린다. Actions 탭 → rollback-production → Run workflow(브랜치 main) → sha.
# 그 sha가 main 이력에 있고 이미지가 모두 ghcr에 있을 때만 production을 그 sha로 옮긴다(강제 갱신은 여기서만,
# --force-with-lease). production push가 Jenkins를 깨워 그 이미지로 배포한다.
# 다음 main push가 검사·이미지를 통과하면 production은 다시 앞으로 간다 — 되돌림을 붙잡아 두려면 main을 고치는 PR을 먼저 넣는다.
#
# 보안 규칙: workflow_dispatch만(저장소 쓰기 권한자만 실행할 수 있다), main에 있는 정의로만 돈다.
# 입력은 환경변수로만 넘기고 스크립트가 40자 16진수인지 본다. GitHub 호스팅 실행기, 액션 SHA 고정, GITHUB_TOKEN 말고 secrets 없음.
name: rollback-production

on:
  workflow_dispatch:
    inputs:
      sha:
        description: production을 옮길 main 커밋 sha(40자)
        required: true
        type: string

permissions: {}

concurrency:
  group: production-branch
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      packages: read
    env:
      SHA: ${{ inputs.sha }}
      # image.yml matrix의 이미지 전부(공백으로 나눔). 여럿인 저장소는 여기에 더한다.
      PROMOTE_IMAGES: ghcr.io/sandcorporation/sandcorp-metrics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - name: ghcr 읽기 로그인
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: production 되돌리기
        run: bash scripts/ci/promote.sh rollback "$SHA"
      - name: ghcr 로그아웃
        if: always()
        run: docker logout ghcr.io
