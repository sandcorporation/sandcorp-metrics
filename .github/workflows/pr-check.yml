# PR 검사: 린트·타입·시험. GitHub 호스팅 실행기만 쓰고 비밀값은 쓰지 않는다.
# 배포는 Jenkins(main push)가 맡는다. 보안 규칙: pull_request_target 금지, self-hosted 금지, 최소 권한.
name: pr-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_CPU_LIMIT: "0" # 공유 실행기는 CPU 초가 부푼다 — 시험 시간 한도 훅은 로컬 전용
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: uv 설치 (의존성 캐시는 main push 실행이 저장하고 PR은 복원한다)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' }}
          cache-dependency-glob: |
            backend/uv.lock
      - name: MySQL 띄우기 (docker-compose.yml의 db, 127.0.0.1:15445)
        run: docker compose up -d --wait db
      - name: sandcorp-authkit을 https로 받게 하기
        # pyproject는 ssh://git@github.com/sandcorporation/sandcorp-auth.git 으로 적혀 있다(운영 빌드는 SSH 키).
        # 공개 저장소라 인증 없이 https로 받는다. 키·토큰은 쓰지 않는다.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
          cd backend && uv sync --frozen
      - name: 린트
        run: make lint
      - name: 타입
        run: make typecheck
      - name: 시험
        run: make test
