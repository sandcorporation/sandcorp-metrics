# PR 검사: 린트·타입·시험. GitHub 호스팅 실행기만 쓰고 비밀값은 쓰지 않는다.
# main push에서는 release.yml이 이 워크플로를 workflow_call로 불러 같은 검사를 돌린다(#32) — 통과해야 이미지·승격으로 간다.
# 그때 github.event_name은 부른 쪽의 push라 uv 캐시는 main에서만 저장된다.
# 보안 규칙: pull_request_target 금지, self-hosted 금지, 최소 권한.
name: pr-check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # PR은 번호마다 새 push가 옛 실행을 끊는다. main(workflow_call)은 커밋마다 따로 — 끊기면 그 sha의 승격 실행이 취소로 끝난다.
  group: pr-check-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_CPU_LIMIT: "0" # 공유 실행기는 CPU 초가 부푼다 — 시험 시간 한도 훅은 로컬 전용
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - name: uv 설치 (의존성 캐시는 main push 실행이 저장하고 PR은 복원한다)
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.9"
          enable-cache: true
          save-cache: ${{ github.event_name == 'push' }}
          cache-dependency-glob: |
            backend/uv.lock
      - name: MySQL 띄우기 (docker-compose.yml의 db, 127.0.0.1:15445)
        run: docker compose up -d --wait db
      - name: sandcorp-authkit을 https로 받게 하기
        # pyproject는 ssh://git@github.com/sandcorporation/sandcorp-auth.git 으로 적혀 있다(운영 빌드는 SSH 키).
        # 공개 저장소라 인증 없이 https로 받는다. 키·토큰은 쓰지 않는다.
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: 의존성
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config default-libmysqlclient-dev
          cd backend && uv sync --frozen
      - name: 린트
        run: make lint
      - name: 타입
        run: make typecheck
      - name: 시험
        run: make test
      - name: 승격 스크립트 시험
        run: bash scripts/ci/promote_test.sh
