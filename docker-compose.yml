# 로컬 개발·시험용 MySQL. 운영(OCI MySQL HeatWave)과 같은 엔진·콜레이션으로 시험한다(포트 15445, 프로젝트 metrics-dev).
# portfolio-dev(15442)·news-dev(15443)와 같은 머신에서 함께 띄울 수 있게 포트와 프로젝트 이름을 나눴다.
# 아래 innodb·binlog 옵션은 시험 속도용 로컬 전용이다(운영 DB와 무관).
#   make db
name: metrics-dev
services:
  db:
    image: mysql:26.10.0
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_as_cs
      - --skip-log-bin
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-doublewrite=OFF
    environment:
      MYSQL_ROOT_PASSWORD: metrics
      MYSQL_DATABASE: metrics
      MYSQL_USER: metrics
      MYSQL_PASSWORD: metrics
    ports:
      - "127.0.0.1:15445:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./deploy/mysql/dev-init.sql:/docker-entrypoint-initdb.d/dev-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -umetrics -pmetrics -e 'SELECT 1' metrics"]
      interval: 2s
      timeout: 3s
      retries: 60
volumes:
  mysqldata:
